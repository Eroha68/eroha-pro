# Emergency fail-closed candidate. Intentionally DOES NOT deploy.
# Production roll-out requires owner approval plus separate Guardian and credential changes.
name: EROHA HF deployment blocked pending independent Guardian

on:
  push:
    branches:
      - main
    paths:
      - app.py
      - src/**
      - requirements.txt
      - .github/workflows/deploy.yml

permissions:
  contents: read

concurrency:
  group: eroha-hf-quarantine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-quarantine:
    name: HF deploy blocked - no independent authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Explicit fail-closed status (no checkout, secrets, network or deployment)
        shell: bash
        run: |
          set -euo pipefail
          echo "::error title=EROHA HF deployment NO-GO::Direct Hugging Face deploy is disabled until independent Guardian approval, protected environment, and credential rotation are independently verified."
          exit 41
