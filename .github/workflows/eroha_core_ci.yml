name: Eroha Core CI/CD

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *' # запуск каждый день в 09:00 UTC

permissions:
  contents: read

concurrency:
  group: eroha-core-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eligibility:
    name: Skip release when current SHA already has a SemVer tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Read complete tags without persisted checkout credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether HEAD is eligible and tagged release has an archive
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tags="$(git tag --points-at "$GITHUB_SHA" --sort=-v:refname)"
          matching_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              matching_tag="$tag"
              break
            fi
          done <<< "$tags"
          if [[ -n "$matching_tag" ]]; then
            archive_assets="$(gh release view "$matching_tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft --jq 'if .isDraft then 0 else [.assets[] | select(.name == "ErohaSuite_Core.zip" and .size > 0)] | length end')"
            if [[ "$archive_assets" != "1" ]]; then
              echo "::error::TAGGED_RELEASE_WITHOUT_ARCHIVE_ASSET tag=$matching_tag count=$archive_assets"
              exit 41
            fi
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_ELIGIBILITY=SKIP_ASSET_PRESENT_NOT_ATTESTED"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "RELEASE_ELIGIBILITY=NEW_SHA"
          fi
  validate-core:
    name: 🧩 Проверка структуры проекта
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Скачиваем репозиторий
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: ✅ Проверяем YAML-файлы
        run: |
          pip install yamllint
          yamllint -d relaxed .

      - name: Reject archive leaks and unsafe committed entries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_build_release_archive.py' -v

      - name: ✅ Проверяем JSON-файлы
        run: |
          for f in $(find . -name "*.json"); do
            echo "Проверяем $f"
            python -m json.tool < $f > /dev/null || exit 1
          done

      - name: 🔒 Проверяем целостность документации
        run: |
          if [ -f ErohaPRO_Implementation_Plan_v1.md ]; then
            sha256sum ErohaPRO_Implementation_Plan_v1.md || true
          else
            echo "Файл документации не найден, пропускаем шаг."
          fi

  powershell-check:
    name: 🔍 Проверка PowerShell-скриптов
    runs-on: windows-latest
    steps:
      - name: 📥 Скачиваем репозиторий
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: ⚙️ Проверяем синтаксис PowerShell-файлов
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $psFiles = Get-ChildItem -Path . -Recurse -Include *.ps1 -ErrorAction SilentlyContinue
          if ($psFiles.Count -eq 0) {
            Write-Host "PowerShell файлов не найдено, шаг пропущен."
          } else {
            foreach ($file in $psFiles) {
              Write-Host "Проверяем $($file.FullName)"
              try {
                $tokens = $null
                $parseErrors = $null
                [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$tokens, [ref]$parseErrors
                )
                if ($parseErrors.Count -gt 0) {
                  $details = ($parseErrors | ForEach-Object { $_.ToString() }) -join "; "
                  throw "PowerShell syntax rejected: $details"
                }
              } catch {
                Write-Error "Ошибка в $($file.FullName): $_"
                exit 1
              }
            }
          }

  build-archive:
    name: 📦 Сборка и архивирование ядра Eroha Core
    runs-on: ubuntu-latest
    needs: [validate-core, powershell-check, eligibility, guardian-authorization]
    if: ${{ needs.eligibility.outputs.should_release == 'true' && needs.guardian-authorization.result == 'success' }}
    timeout-minutes: 10
    outputs:
      archive_sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: 📥 Скачиваем репозиторий
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build pinned release archive from Git blobs only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/build_release_archive.py \
            --repo . --commit "$GITHUB_SHA" --output artifacts/ErohaSuite_Core.zip
          test -s artifacts/ErohaSuite_Core.zip
          unzip -t artifacts/ErohaSuite_Core.zip

      - name: Capture trusted job-local SHA-256 of release ZIP
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/ErohaSuite_Core.zip
          unzip -t artifacts/ErohaSuite_Core.zip
          sha="$(sha256sum artifacts/ErohaSuite_Core.zip | cut -d ' ' -f1)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: 🚀 Сохраняем артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ErohaSuite_Core_Build
          path: artifacts/ErohaSuite_Core.zip
          if-no-files-found: error

  guardian-authorization:
    name: EROHA NO-GO - independent release authorization missing
    runs-on: ubuntu-24.04
    needs: [eligibility]
    if: always()
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Fail closed until independently managed Guardian is deployed
        shell: bash
        run: |
          set -euo pipefail
          echo "::error title=EROHA Guardian NO-GO::No independently signed, non-replayable release authorization from a separately controlled Guardian is configured."
          exit 41
