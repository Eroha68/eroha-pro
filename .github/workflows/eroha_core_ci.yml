name: Eroha Core CI/CD

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *' # запуск каждый день в 09:00 UTC

permissions:
  contents: read

concurrency:
  group: eroha-core-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eligibility:
    name: Skip release when current SHA already has a SemVer tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Read complete tags without persisted checkout credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether HEAD is eligible and tagged release has an archive
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tags="$(git tag --points-at "$GITHUB_SHA" --sort=-v:refname)"
          matching_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              matching_tag="$tag"
              break
            fi
          done <<< "$tags"
          if [[ -n "$matching_tag" ]]; then
            archive_assets="$(gh release view "$matching_tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft --jq 'if .isDraft then 0 else [.assets[] | select(.name == "ErohaSuite_Core.zip" and .size > 0)] | length end')"
            if [[ "$archive_assets" != "1" ]]; then
              echo "::error::TAGGED_RELEASE_WITHOUT_ARCHIVE_ASSET tag=$matching_tag count=$archive_assets"
              exit 41
            fi
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_ELIGIBILITY=SKIP_ASSET_PRESENT_NOT_ATTESTED"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "RELEASE_ELIGIBILITY=NEW_SHA"
          fi
  validate-core:
    name: 🧩 Проверка структуры проекта
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: ✅ Проверяем YAML-файлы
        run: |
          pip install yamllint
          yamllint -d relaxed .

      - name: Reject archive leaks and unsafe committed entries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_build_release_archive.py' -v

      - name: ✅ Проверяем JSON-файлы
        run: |
          for f in $(find . -name "*.json"); do
            echo "Проверяем $f"
            python -m json.tool < $f > /dev/null || exit 1
          done

      - name: 🔒 Проверяем целостность документации
        run: |
          if [ -f ErohaPRO_Implementation_Plan_v1.md ]; then
            sha256sum ErohaPRO_Implementation_Plan_v1.md || true
          else
            echo "Файл документации не найден, пропускаем шаг."
          fi

  powershell-check:
    name: 🔍 Проверка PowerShell-скриптов
    runs-on: windows-latest
    steps:
      - name: 📥 Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: ⚙️ Проверяем синтаксис PowerShell-файлов
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $psFiles = Get-ChildItem -Path . -Recurse -Include *.ps1 -ErrorAction SilentlyContinue
          if ($psFiles.Count -eq 0) {
            Write-Host "PowerShell файлов не найдено, шаг пропущен."
          } else {
            foreach ($file in $psFiles) {
              Write-Host "Проверяем $($file.FullName)"
              try {
                $tokens = $null
                $parseErrors = $null
                [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$tokens, [ref]$parseErrors
                )
                if ($parseErrors.Count -gt 0) {
                  $details = ($parseErrors | ForEach-Object { $_.ToString() }) -join "; "
                  throw "PowerShell syntax rejected: $details"
                }
              } catch {
                Write-Error "Ошибка в $($file.FullName): $_"
                exit 1
              }
            }
          }

  build-archive:
    name: 📦 Сборка и архивирование ядра Eroha Core
    runs-on: ubuntu-latest
    needs: [validate-core, powershell-check, eligibility]
    if: needs.eligibility.outputs.should_release == 'true'
    timeout-minutes: 10
    outputs:
      archive_sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: 📥 Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: Build pinned release archive from Git blobs only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/build_release_archive.py \
            --repo . --commit "$GITHUB_SHA" --output artifacts/ErohaSuite_Core.zip
          test -s artifacts/ErohaSuite_Core.zip
          unzip -t artifacts/ErohaSuite_Core.zip

      - name: Capture trusted job-local SHA-256 of release ZIP
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/ErohaSuite_Core.zip
          unzip -t artifacts/ErohaSuite_Core.zip
          sha="$(sha256sum artifacts/ErohaSuite_Core.zip | cut -d ' ' -f1)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: 🚀 Сохраняем артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ErohaSuite_Core_Build
          path: artifacts/ErohaSuite_Core.zip
          if-no-files-found: error

  guardian-authorization:
    name: EROHA NO-GO - independent release authorization missing
    runs-on: ubuntu-24.04
    needs: [eligibility, build-archive]
    if: needs.eligibility.outputs.should_release == 'true'
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Fail closed until independently managed Guardian is deployed
        shell: bash
        run: |
          set -euo pipefail
          echo "::error title=EROHA Guardian NO-GO::No independently signed, non-replayable release authorization from a separately controlled Guardian is configured."
          exit 41

  release:
    name: 🏁 Автоматическая публикация релиза
    runs-on: ubuntu-latest
    needs: [build-archive, eligibility, guardian-authorization]
    if: needs.eligibility.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: 📥 Скачиваем репозиторий с тэгами
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: ErohaSuite_Core_Build
          path: artifacts

      - name: Reject missing, corrupt or altered release archive
        shell: bash
        env:
          EXPECTED_ZIP_SHA256: ${{ needs.build-archive.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -s artifacts/ErohaSuite_Core.zip
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA256" artifacts/ErohaSuite_Core.zip | sha256sum --check --status
          unzip -t artifacts/ErohaSuite_Core.zip
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prepare release version and notes without environment-file injection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True)
          head = git('rev-parse','HEAD').strip()
          if head != os.environ['GITHUB_SHA']:
              raise SystemExit('CHECKOUT_SHA_MISMATCH')
          entries = []
          for tag in git('tag','--list').splitlines():
              match = re.fullmatch(r'v([0-9]+)\.([0-9]+)\.([0-9]+)', tag)
              if match:
                  entries.append((tuple(map(int, match.groups())), tag))
          entries.sort()
          previous = entries[-1][1] if entries else None
          major, minor, patch = entries[-1][0] if entries else (1, 0, -1)
          new_tag = f'v{major}.{minor}.{patch+1}'
          if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', new_tag) is None:
              raise SystemExit('INVALID_VERSION_TAG')
          if subprocess.run(['git','show-ref','--verify','--quiet',f'refs/tags/{new_tag}']).returncode == 0:
              raise SystemExit('TAG_ALREADY_EXISTS')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write(f'NEW_TAG={new_tag}\n')
          log = git('log','-n','10','--pretty=format:- %s (%an, %ad, %h)','--date=short')
          changed = git('diff','--name-only',previous,'HEAD') if previous else git('ls-files')
          notes = ('🇷🇺 Описание релиза\nНовая версия ядра Eroha Core.\n\n'
                   '🇰🇿 Релиз сипаттамасы\nEroha Core ядросының жаңа нұсқасы.\n\n'
                   'Изменения (Changelog)\n',log,'\n\nИзменённые файлы\n',changed)
          notes_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'eroha-release-notes.md'
          notes_path.write_text(''.join(notes),encoding='utf-8')
          if notes_path.stat().st_size == 0:
              raise SystemExit('EMPTY_RELEASE_NOTES')
          print('RELEASE_CANDIDATE_NOT_PUBLISHED', new_tag)
          PY

      - name: Create unpublished draft with required archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$NEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s artifacts/ErohaSuite_Core.zip
          if gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::RELEASE_TAG_ALREADY_HAS_RELEASE"
            exit 42
          fi
          gh release create "$NEW_TAG" artifacts/ErohaSuite_Core.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Eroha Core Release $NEW_TAG" \
            --notes-file "$RUNNER_TEMP/eroha-release-notes.md" --draft
          echo "DRAFT_CREATED_NOT_PUBLISHED"

      - name: Check draft, remote tag and downloaded asset before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ZIP_SHA256: ${{ needs.build-archive.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          release_json="$(gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,targetCommitish,tagName)"
          printf '%s\n' "$release_json" | jq -e '
            .isDraft == true and
            .tagName == env.NEW_TAG and
            .targetCommitish == env.GITHUB_SHA and
            (.assets | length) == 1 and
            ([.assets[] | select(.name == "ErohaSuite_Core.zip" and .size > 0)] | length) == 1
          ' >/dev/null
          mkdir -p "$RUNNER_TEMP/eroha-release-verify"
          gh release download "$NEW_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ErohaSuite_Core.zip' --dir "$RUNNER_TEMP/eroha-release-verify"
          test -s "$RUNNER_TEMP/eroha-release-verify/ErohaSuite_Core.zip"
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA256" "$RUNNER_TEMP/eroha-release-verify/ErohaSuite_Core.zip" | sha256sum --check --status
          unzip -t "$RUNNER_TEMP/eroha-release-verify/ErohaSuite_Core.zip"
          echo "DRAFT_ASSET_VERIFIED_NOT_PUBLISHED"

      - name: Recheck remote draft bytes immediately before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ZIP_SHA256: ${{ needs.build-archive.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          release_json="$(gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,targetCommitish,tagName)"
          printf '%s\n' "$release_json" | jq -e '
            .isDraft == true and
            .tagName == env.NEW_TAG and
            .targetCommitish == env.GITHUB_SHA and
            (.assets | length) == 1 and
            ([.assets[] | select(.name == "ErohaSuite_Core.zip" and .size > 0)] | length) == 1
          ' >/dev/null
          verify_dir="$(mktemp -d "$RUNNER_TEMP/eroha-final-verify.XXXXXX")"
          gh release download "$NEW_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ErohaSuite_Core.zip' --dir "$verify_dir"
          test -s "$verify_dir/ErohaSuite_Core.zip"
          printf '%s  %s\n' "$EXPECTED_ZIP_SHA256" "$verify_dir/ErohaSuite_Core.zip" | sha256sum --check --status
          unzip -t "$verify_dir/ErohaSuite_Core.zip"
          echo "FINAL_REMOTE_DRAFT_SHA256_VERIFIED"

      - name: Publish only after draft verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          release_json="$(gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,targetCommitish,tagName)"
          printf '%s\n' "$release_json" | jq -e '
            .isDraft == false and
            .tagName == env.NEW_TAG and
            .targetCommitish == env.GITHUB_SHA and
            (.assets | length) == 1 and
            ([.assets[] | select(.name == "ErohaSuite_Core.zip" and .size > 0)] | length) == 1
          ' >/dev/null
          published_tag="$(git ls-remote --tags origin "refs/tags/$NEW_TAG" | awk 'NR==1 {print $1}')"
          test "$published_tag" = "$GITHUB_SHA"
          echo "PUBLISHED_RELEASE_ASSET_PRESENT_NOT_INDEPENDENTLY_ATTESTED"

