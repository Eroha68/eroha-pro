# test trigger
name: Eroha Core CI/CD

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *' # запуск каждый день в 09:00 UTC

permissions:
  contents: write  # 👈 разрешаем боту пушить теги и создавать релизы

jobs:
  validate-core:
    name: 🧩 Проверка структуры проекта
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: ✅ Проверяем YAML-файлы
        run: |
          pip install yamllint
          yamllint . || true

      - name: ✅ Проверяем JSON-файлы
        run: |
          for f in $(find . -name "*.json"); do
            echo "Проверяем $f"
            python -m json.tool < $f > /dev/null || exit 1
          done

      - name: 🔒 Проверяем целостность документации
        run: |
          if [ -f ErohaPRO_Implementation_Plan_v1.md ]; then
            sha256sum ErohaPRO_Implementation_Plan_v1.md || true
          else
            echo "Файл документации не найден, пропускаем шаг."
          fi

  powershell-check:
    name: 🔍 Проверка PowerShell-скриптов
    runs-on: windows-latest
    steps:
      - name: 📥 Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: ⚙️ Проверяем синтаксис PowerShell-файлов
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $psFiles = Get-ChildItem -Path . -Recurse -Include *.ps1 -ErrorAction SilentlyContinue
          if ($psFiles.Count -eq 0) {
            Write-Host "PowerShell файлов не найдено, шаг пропущен."
          } else {
            foreach ($file in $psFiles) {
              Write-Host "Проверяем $($file.FullName)"
              try {
                pwsh -NoLogo -NoProfile -Command "Get-Command '$($file.FullName)' | Out-Null"
              } catch {
                Write-Error "Ошибка в $($file.FullName): $_"
                exit 1
              }
            }
          }

  build-archive:
    name: 📦 Сборка и архивирование ядра Eroha Core
    runs-on: ubuntu-latest
    needs: [validate-core, powershell-check]
    steps:
      - name: 📥 Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: 🗜️ Создаём архив ядра
        run: |
          mkdir -p artifacts
          zip -r artifacts/ErohaSuite_Core.zip . -x "*.git*" ".github/*" "__pycache__/*"

      - name: 🚀 Сохраняем артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ErohaSuite_Core_Build
          path: artifacts/ErohaSuite_Core.zip

  release:
    name: 🏁 Автоматическая публикация релиза
    runs-on: ubuntu-latest
    needs: [build-archive]
    steps:
      - name: 📥 Скачиваем репозиторий с тэгами
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧮 Генерируем новый номер версии
        id: version
        run: |
          TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            BASE=${TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "🔖 Новая версия: $NEW_TAG"

      - name: 🧾 Генерация changelog (10 последних коммитов)
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log -n 10 --pretty=format:"- %s (%an, %ad, %h)" --date=short >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 📂 Список изменённых файлов с прошлого тега
        id: changed_files
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n 2p)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_ENV
          echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
          if [ -z "$PREV_TAG" ]; then
            git diff --name-only HEAD~10 >> $GITHUB_ENV
          else
            git diff --name-only $PREV_TAG HEAD >> $GITHUB_ENV
          fi
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 🏷️ Создаём новый тег
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git tag $NEW_TAG
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git $NEW_TAG

      - name: 🚀 Публикуем релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: "Eroha Core Release ${{ env.NEW_TAG }}"
          body: |
            🇷🇺 **Описание релиза**
            Новая версия ядра Eroha Core с улучшенной проверкой CI/CD, автогенерацией версий и changelog.

            🇰🇿 **Релиз сипаттамасы**
            Eroha Core ядросының жаңа нұсқасы. CI/CD жақсартылды, нұсқалар және өзгерістер тізімі автоматты түрде жасалады.

            🧩 **Изменения (Changelog)**
            ${{ env.CHANGELOG }}

            📂 **Изменённые файлы**
            ${{ env.CHANGED_FILES }}

            🗓️ Дата релиза: ${{ github.event.head_commit.timestamp }}
            👤 Автор: ${{ github.actor }}
          files: artifacts/ErohaSuite_Core.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
