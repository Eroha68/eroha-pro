name: EROHA HF quarantine smoke - no deployment
on:
  push:
    branches:
      - security/eroha-hf-failclosed-quarantine-20261110

permissions:
  contents: read

jobs:
  quarantine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate deploy workflow syntax without execution
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'YAML.parse(STDIN.read)' < .github/workflows/deploy.yml
          echo "HF_QUARANTINE_YAML_SYNTAX=PASS"
      - name: Check fail-closed quarantine and adversarial mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_hf_quarantine.py' -v
          echo "HF_QUARANTINE_REGRESSION=PASS"
      - name: Assert optimized mode cannot make it succeed
        shell: bash
        run: |
          set -euo pipefail
          python3 -O -m unittest discover -s .github/scripts -p 'test_hf_quarantine.py' -v
          echo "HF_QUARANTINE_OPTIMIZED=PASS"
