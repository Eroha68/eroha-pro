name: EROHA archive secret leakage negative acceptance (LAB ONLY)
on:
  push:
    branches:
      - research/archive-secret-boundary-20261110
  pull_request:
    branches:
      - integration/eroha-release-gate-20261110

permissions:
  contents: read

jobs:
  archive-negative-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/archive-secret-boundary-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout research branch without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify archive builder and synthetic credential-negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s .github/scripts -p 'test_build_release_archive.py' -v
          echo "ARCHIVE_SECRETS_NORMAL=PASS"
          python3 -O -B -m unittest discover -s .github/scripts -p 'test_build_release_archive.py' -v
          echo "ARCHIVE_SECRETS_OPTIMIZED=PASS"

  report-push-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      - name: Read exact push-only CI run without checking out PR code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/runs" \
            -f branch=research/archive-secret-boundary-20261110 -f event=push -f per_page=10 \
            --jq '.workflow_runs | map(select(.path | contains("archive-secret-boundary-lab.yml"))) | .[0] | "PUSH_RUN_ID=\(.id) PUSH_STATUS=\(.status) PUSH_CONCLUSION=\(.conclusion)"'
