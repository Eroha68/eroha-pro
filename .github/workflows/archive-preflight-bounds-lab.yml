name: EROHA bounded Git-blob archive preflight (LAB ONLY)
on:
  push:
    branches:
      - research/archive-preflight-bounds-20261110
  pull_request:
    branches:
      - research/archive-secret-boundary-20261110
permissions:
  contents: read
jobs:
  bounded-archive:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/archive-preflight-bounds-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout research branch with pinned SHA and no stored token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run 23 synthetic tests in normal and optimized Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s .github/scripts -p 'test_build_release_archive.py' -v
          echo "ARCHIVE_BOUNDED_NORMAL_PASS"
          python3 -O -B -m unittest discover -s .github/scripts -p 'test_build_release_archive.py' -v
          echo "ARCHIVE_BOUNDED_OPTIMIZED_PASS"
  reporter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      - name: Read push test result without executing untrusted PR code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/runs" \
            -f branch=research/archive-preflight-bounds-20261110 -f event=push -f per_page=10 \
            --jq '.workflow_runs | map(select(.path | contains("archive-preflight-bounds-lab.yml"))) | .[0] | "PUSH_RUN_ID=\(.id) PUSH_STATUS=\(.status) PUSH_CONCLUSION=\(.conclusion)"'
